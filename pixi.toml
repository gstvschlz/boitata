[workspace]
name = "boitata"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
numpy = ">=1.26"
tqdm = ">=4.66"
pip = "*"
pytest = ">=8"

[feature.min.dependencies]
python = "3.11.*"
numpy = "1.26.*"
tqdm = "4.66.*"
pyarrow = "16.*"
polars = "1.4.*"
pandas = "2.2.*"
matplotlib = "3.8.*"
pyvista = "0.45.*"
ipywidgets = "8.0.*"

[feature.latest.dependencies]
pyarrow = ">=16"
polars = ">=1.4"
pandas = ">=2.2"
matplotlib = ">=3.8"
pyvista = ">=0.45"
ipywidgets = ">=8"

[feature.sdist.dependencies]
rust = ">=1.97"
c-compiler = "*"
maturin = ">=1.10,<2"

[environments]
min = ["min"]
latest = ["latest"]
sdist = ["latest", "sdist"]
