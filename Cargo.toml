[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
criterion = "0.8"
delaunator = "1.1"
dxf = "0.6"
i_overlay = "9"
kiddo = "6"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-arrow = "0.19"
proptest = "1"
arrow-array = "59"
arrow-cast = "59"
arrow-csv = "59"
arrow-ord = "59"
arrow-schema = "59"
arrow-select = "59"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
thiserror = "1"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
libm = "0.2"
rayon = "1.10"
rustfft = "6"
regex = "1"
rand = "0.8"
rand_distr = "0.4"
boitata-core = { path = "crates/core" }
boitata-io = { path = "crates/io" }
variogram = { path = "crates/variogram" }
blocks = { path = "crates/blocks" }
coda = { path = "crates/coda" }
drillholes = { path = "crates/drillholes" }
transforms = { path = "crates/transforms" }
estimation = { path = "crates/estimation" }
simulation = { path = "crates/simulation" }
modeling = { path = "crates/modeling" }
eda = { path = "crates/eda" }

[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
