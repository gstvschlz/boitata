[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
arrow-array = "60"
arrow-cast = "60"
arrow-csv = "60"
arrow-schema = "60"
arrow-select = "60"
serde = { version = "1", features = ["derive"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
thiserror = "1"
rayon = "1.10"
regex = "1"
rand = "0.8"
rand_distr = "0.4"
ceres-core = { path = "crates/core" }
ceres-io = { path = "crates/io" }
variogram = { path = "crates/variogram" }
transforms = { path = "crates/transforms" }
estimation = { path = "crates/estimation" }

[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
