[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-arrow = "0.19"
arrow-array = "59"
arrow-cast = "59"
arrow-csv = "59"
arrow-schema = "59"
arrow-select = "59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
thiserror = "1"
libm = "0.2"
rayon = "1.10"
regex = "1"
rand = "0.8"
rand_distr = "0.4"
ceres-core = { path = "crates/core" }
ceres-io = { path = "crates/io" }
variogram = { path = "crates/variogram" }
transforms = { path = "crates/transforms" }
estimation = { path = "crates/estimation" }
simulation = { path = "crates/simulation" }

[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
