context:
  name: boitata
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Switch to the GitHub tag archive once released (PyPI carries wheels only):
  #   url: https://github.com/gstvschlz/boitata/archive/refs/tags/v${{ version }}.tar.gz
  #   sha256: ...
  path: ../..

build:
  number: 0
  skip:
    - is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - maturin >=1.10,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - if: is_abi3
      then: python-abi3
    - maturin >=1.10,<2
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - tqdm >=4.66

tests:
  - python:
      imports:
        - boitata
        - boitata._boitata
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - abi3audit
        - python ${{ python_min }}.*
    script:
      - if: unix
        then: abi3audit $SP_DIR/boitata/_boitata.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
        else: abi3audit %SP_DIR%\boitata\_boitata.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
  - files:
      recipe:
        - smoke.py
    requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python smoke.py

about:
  homepage: https://github.com/gstvschlz/boitata
  repository: https://github.com/gstvschlz/boitata
  documentation: https://gstvschlz.github.io/boitata/
  summary: Geostatistics in Rust with a Python interface
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - gstvschlz
