# Stand-in for conda-forge-pinning when building locally.
python: ["3.11"]
python_min: ["3.11"]
is_abi3: [true]
is_python_min: [true]
c_compiler:
  - if: win
    then: vs2022
c_stdlib:
  - if: win
    then: vs
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: win
    then: "2022.14"
  - if: linux
    then: "2.17"
  - if: osx
    then: "11.0"
