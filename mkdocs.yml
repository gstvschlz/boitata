site_name: boitatá
site_description: My Python tooling for day-to-day geostatistics.
site_url: https://gstvschlz.github.io/boitata/
repo_url: https://github.com/gstvschlz/boitata
repo_name: gstvschlz/boitata
edit_uri: ""

theme:
  name: material
  logo: assets/logo-dark.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}

extra_css:
  - assets/extra.css
  - assets/components.css
  - assets/swiss.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

extra_javascript:
  - assets/figures.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - assets/katex-init.js

hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  __pycache__/
  snippets/

plugins:
  - search
  - gallery:
      examples_dirs:
        - learn
        - examples/01-getting-started
        - examples/02-drillholes-and-samples
        - examples/03-geometry-and-block-models
        - examples/04-viewing
        - examples/05-exploratory-analysis
        - examples/06-transforms
        - examples/07-variography
        - examples/08-domains-and-geology
        - examples/09-estimation
        - examples/10-simulation
        - examples/11-validation-and-reporting
        - examples/12-case-studies
      gallery_dirs:
        - docs/learn
        - docs/examples/01-getting-started
        - docs/examples/02-drillholes-and-samples
        - docs/examples/03-geometry-and-block-models
        - docs/examples/04-viewing
        - docs/examples/05-exploratory-analysis
        - docs/examples/06-transforms
        - docs/examples/07-variography
        - docs/examples/08-domains-and-geology
        - docs/examples/09-estimation
        - docs/examples/10-simulation
        - docs/examples/11-validation-and-reporting
        - docs/examples/12-case-studies
      filename_pattern: (example_\d\d_\d\d|learn_\d\d)\.py$
      ignore_pattern: (render|common)\.py$
      within_subsection_order: FileNameSortKey
      show_memory: false
      inspect_global_variables: false
