site_name: ceres
site_description: Geostatistics in Rust with a Python interface
site_url: https://gstvschlz.github.io/ceres/
repo_url: https://github.com/gstvschlz/ceres
repo_name: gstvschlz/ceres
edit_uri: ""

theme:
  name: material
  logo: assets/logo-dark.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - assets/extra.css

hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  __pycache__/

plugins:
  - search
  - gallery:
      examples_dirs: [examples/tutorials, examples/topics]
      gallery_dirs: [docs/examples/tutorials, docs/examples/topics]
      filename_pattern: (example|tutorial)_\d+\.py$
      ignore_pattern: (render|common)\.py$
      within_subsection_order: FileNameSortKey
      show_memory: false
  - mkdocstrings:
      handlers:
        python:
          options:
            force_inspection: true
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc: {permalink: true}

nav:
  - Home: index.md
  - Examples:
      - Tutorials: examples/tutorials
      - Topics: examples/topics
  - API:
      - Containers and I/O: api/containers.md
      - Datasets and plots: api/datasets.md
      - Transforms: api/transforms.md
      - Variography: api/variography.md
      - Estimation: api/estimation.md
      - Simulation: api/simulation.md
      - Drillholes and blocks: api/drillholes.md
      - Modeling: api/modeling.md
      - EDA and validation: api/eda.md
