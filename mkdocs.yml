site_name: ceres
site_description: My Python tooling for day-to-day geostatistics.
site_url: https://gstvschlz.github.io/ceres/
repo_url: https://github.com/gstvschlz/ceres
repo_name: gstvschlz/ceres
edit_uri: ""

theme:
  name: material
  logo: assets/logo-dark.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - assets/extra.css

hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  __pycache__/

plugins:
  - search
  - gallery:
      examples_dirs:
        - examples/01-first-steps
        - examples/02-data-and-geometry
        - examples/03-exploratory-analysis
        - examples/04-transforms
        - examples/05-spatial-continuity
        - examples/06-kriging
        - examples/07-categories-and-domains
        - examples/08-stochastic-simulation
        - examples/09-recoverable-resources
        - examples/10-checking-models
        - examples/11-geological-modeling
        - examples/12-case-studies
      gallery_dirs:
        - docs/examples/01-first-steps
        - docs/examples/02-data-and-geometry
        - docs/examples/03-exploratory-analysis
        - docs/examples/04-transforms
        - docs/examples/05-spatial-continuity
        - docs/examples/06-kriging
        - docs/examples/07-categories-and-domains
        - docs/examples/08-stochastic-simulation
        - docs/examples/09-recoverable-resources
        - docs/examples/10-checking-models
        - docs/examples/11-geological-modeling
        - docs/examples/12-case-studies
      filename_pattern: example_\d\d_\d\d\.py$
      ignore_pattern: (render|common)\.py$
      within_subsection_order: FileNameSortKey
      show_memory: false
      inspect_global_variables: false
  - mkdocstrings:
      handlers:
        python:
          options:
            force_inspection: true
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            inherited_members: true
            show_bases: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc: {permalink: true}

nav:
  - Home: index.md
  - Install: install.md
  - Examples:
      - First steps: examples/01-first-steps
      - Data and geometry: examples/02-data-and-geometry
      - Exploratory analysis: examples/03-exploratory-analysis
      - Transforms: examples/04-transforms
      - Spatial continuity: examples/05-spatial-continuity
      - Kriging: examples/06-kriging
      - Categories and domains: examples/07-categories-and-domains
      - Stochastic simulation: examples/08-stochastic-simulation
      - Recoverable resources: examples/09-recoverable-resources
      - Checking models: examples/10-checking-models
      - Geological modeling: examples/11-geological-modeling
      - Case studies: examples/12-case-studies
  - API: []
