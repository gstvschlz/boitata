site_name: boitatá
site_description: my python tooling for day-to-day geostatistics.
site_url: https://gstvschlz.github.io/boitata/
repo_url: https://github.com/gstvschlz/boitata
repo_name: gstvschlz/boitata
edit_uri: ""

theme:
  name: material
  logo: assets/logo-dark.svg
  favicon: assets/favicon.svg
  font:
    text: Inter Tight
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - assets/extra.css
  - assets/components.css
  - assets/swiss.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

extra_javascript:
  - assets/figures.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - assets/katex-init.js

hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  __pycache__/
  snippets/

plugins:
  - search
  - gallery:
      examples_dirs:
        - learn
        - examples/01-first-steps
        - examples/02-data-and-geometry
        - examples/03-exploratory-analysis
        - examples/04-transforms
        - examples/05-spatial-continuity
        - examples/06-kriging
        - examples/07-categories-and-domains
        - examples/08-stochastic-simulation
        - examples/09-recoverable-resources
        - examples/10-checking-models
        - examples/11-geological-modeling
        - examples/12-case-studies
        - examples/13-multiple-point-statistics
        - examples/14-workflows
      gallery_dirs:
        - docs/learn
        - docs/examples/01-first-steps
        - docs/examples/02-data-and-geometry
        - docs/examples/03-exploratory-analysis
        - docs/examples/04-transforms
        - docs/examples/05-spatial-continuity
        - docs/examples/06-kriging
        - docs/examples/07-categories-and-domains
        - docs/examples/08-stochastic-simulation
        - docs/examples/09-recoverable-resources
        - docs/examples/10-checking-models
        - docs/examples/11-geological-modeling
        - docs/examples/12-case-studies
        - docs/examples/13-multiple-point-statistics
        - docs/examples/14-workflows
      filename_pattern: (example_\d\d_\d\d|learn_\d\d)\.py$
      ignore_pattern: (render|common)\.py$
      within_subsection_order: FileNameSortKey
      show_memory: false
      inspect_global_variables: false
  - mkdocstrings:
      handlers:
        python:
          options:
            force_inspection: true
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            inherited_members: true
            show_bases: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - abbr
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.snippets: {base_path: [docs/snippets], check_paths: true, auto_append: [glossary.md]}
  - pymdownx.tabbed: {alternate_style: true}
  - toc: {permalink: true}

nav:
  - home: index.md
  - install: install.md
  - learn: learn
  - guide:
      - how boitatá is organized: guide/organization.md
      - containers and arrow: guide/containers.md
      - fit, transform, predict: guide/estimators.md
      - saving models: guide/saving.md
      - which page do i need?: guide/finder.md
      - glossary: guide/glossary.md
  - examples:
      - first steps: examples/01-first-steps
      - data and geometry: examples/02-data-and-geometry
      - exploratory analysis: examples/03-exploratory-analysis
      - transforms: examples/04-transforms
      - spatial continuity: examples/05-spatial-continuity
      - kriging: examples/06-kriging
      - categories and domains: examples/07-categories-and-domains
      - stochastic simulation: examples/08-stochastic-simulation
      - recoverable resources: examples/09-recoverable-resources
      - checking models: examples/10-checking-models
      - geological modeling: examples/11-geological-modeling
      - case studies: examples/12-case-studies
      - multiple-point statistics: examples/13-multiple-point-statistics
      - workflows: examples/14-workflows
  - API: []
