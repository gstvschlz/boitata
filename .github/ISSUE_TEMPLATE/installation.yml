name: Installation problem
description: Report a failure to build, install or import boitata.
title: "BUG: <write a short title after the 'BUG: ' prefix>"
labels: [bug, infra]

body:
- type: textarea
  attributes:
    label: "Steps to reproduce:"
    description: >
      The commands you ran, for example `pip install "boitata[all]"`.
    render: shell
  validations:
    required: true

- type: textarea
  attributes:
    label: "Error message:"
    description: The full build log or traceback.
    render: shell
  validations:
    required: true

- type: textarea
  attributes:
    label: "Environment:"
    description: >
      Operating system, Python version, how you installed Boitatá (pip, uv, conda,
      pixi, ...), and your Rust version (`rustc --version`) if it built from source.
  validations:
    required: true
