name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - Cargo.*
      - crates/**
      - python/ceres/**
      - .github/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      - name: abi3audit
        shell: bash
        run: pipx run abi3audit --strict --assume-minimum-abi3 3.11 --verbose dist/*.whl
      - name: no libpython link
        if: runner.os == 'Linux'
        run: |
          pipx run auditwheel show dist/*.whl
          unzip -q -d wheel dist/*.whl
          readelf -d wheel/ceres/_ceres*.so | tee needed.txt
          ! grep -i libpython needed.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: git-cliff
      - run: git-cliff --latest --strip header -o notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "ceres ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
