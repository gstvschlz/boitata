<svg class="bt-svg" viewBox="0 0 720 470" role="img" aria-labelledby="g-api-map-t">
<title id="g-api-map-t">Boitatá in five layers: loaders bring data into containers; functions, value objects and estimators work on the containers; plots and files take the results out; a Rust core does the computing</title>
<g class="a-fade" style="--d:0s">
<text class="small" x="16" y="47">1 · get data</text>
<rect class="f-paper s-muted" x="130" y="20" width="267" height="46" rx="6" stroke-width="1.5"/>
<text x="263.5" y="40" text-anchor="middle">bt.datasets</text>
<text class="small" x="263.5" y="57" text-anchor="middle">downloaded once, cached, checksummed</text>
<rect class="f-paper s-muted" x="413" y="20" width="267" height="46" rx="6" stroke-width="1.5"/>
<text x="546.5" y="40" text-anchor="middle">read_csv · read_parquet · read_mesh</text>
<text class="small" x="546.5" y="57" text-anchor="middle">open formats; sentinels such as -999 become null</text>
</g>
