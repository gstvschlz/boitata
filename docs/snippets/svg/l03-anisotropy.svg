<svg class="bt-svg" viewBox="0 0 640 340" role="img" aria-labelledby="l03-ani-t">
<title id="l03-ani-t">The anisotropy ellipse of the Walker Lake model, azimuth measured clockwise from north, and dip measured downward from horizontal</title>
<line class="s-muted dash" x1="190" y1="319" x2="190" y2="20" stroke-width="1"/>
<text x="185" y="16">N</text>
<ellipse class="s-night f-night-soft a-draw" pathLength="1" stroke-width="2.2" cx="190" cy="170" rx="143.8" ry="48.3" transform="rotate(71.46 190 170)"/>
<line class="s-ember a-fade" style="--d:.9s" x1="190" y1="170" x2="235.7" y2="306.3" stroke-width="2.5"/>
<line class="s-flame a-fade" style="--d:1.1s" x1="190" y1="170" x2="144.2" y2="185.4" stroke-width="2.5"/>
<text class="a-fade" style="--d:1s" x="243.7" y="306.3">major 115 m</text>
<text class="a-fade" style="--d:1.2s" x="74.2" y="221.4">minor 39 m</text>
<path class="s-ink none a-draw" pathLength="1" style="--d:1.3s" stroke-width="1.2" d="M190 130 A40 40 0 0 1 202.7 207.9"/>
<text class="a-fade" style="--d:1.5s" x="268" y="174">azimuth 161°</text>
<text class="small a-fade" style="--d:1.5s" x="268" y="192">clockwise from north</text>
<line class="s-grid" x1="430" y1="30" x2="430" y2="320" stroke-width="1"/>
<text class="small" x="460" y="60">vertical section</text>
<line class="s-muted" x1="460" y1="130" x2="620" y2="130" stroke-width="1.5"/>
<text class="small" x="580" y="122">horizontal</text>
<line class="s-ember a-draw" pathLength="1" style="--d:1.6s" x1="460" y1="130" x2="589.9" y2="205.0" stroke-width="2.5"/>
<path class="s-ink none" stroke-width="1.2" d="M520 130 A60 60 0 0 1 512.0 160.0"/>
<text x="526" y="160">dip 30°</text>
<text class="small" x="460" y="250">positive dip points down</text>
<text class="small" x="460" y="266">z is up</text>
</svg>
