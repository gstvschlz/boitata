<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><style>
.s{animation:on .5s cubic-bezier(.2,.8,.3,1.2) backwards}
.g{fill:#FFF3C4;opacity:0;animation:wave 2.8s ease-in-out 1.6s infinite}
.t{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:flick 2.8s 1.6s infinite}
.e{transform-box:fill-box;transform-origin:50% 50%;animation:on .5s 1.04s backwards,blink 5.6s 2s infinite}
@keyframes on{from{opacity:0;transform:translateY(-3px)}}
@keyframes wave{0%,30%,100%{opacity:0}12%{opacity:.55}}
@keyframes flick{0%,70%,100%{transform:scaleX(0)}78%,90%{transform:scaleX(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.s,.g,.t,.e{animation:none}.t{transform:none}}
