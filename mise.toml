[env]
_.path = ["~/.cargo/bin"]

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
depends = ["py:build"]
run = ["cargo test --workspace --exclude boitata-py", "uv run --no-sync pytest -q"]

[tasks.lint]
depends = ["py:sync"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "uv run --no-sync ruff check python examples ci",
  "uv run --no-sync ruff format --check python examples ci",
]

[tasks."py:sync"]
run = "uv sync -q --inexact"

[tasks."py:build"]
depends = ["py:sync"]
run = "uv run --no-sync maturin develop -q --uv --release"

[tasks.verify]
depends = ["lint", "test"]

[tasks.dist]
run = "python ci/compat.py dist"

[tasks.compat]
usage = 'arg "[mode]" default="all" help="all, dist, venv, uv, pixi or conda"'
run = "python ci/compat.py {{usage.mode}}"

[tools]
pixi = "0.81"
git-cliff = "2.13"
python = "3.13"
uv = "0.12"
micromamba = "2.9"

[tasks.examples]
depends = ["py:build"]
run = "uv run --no-sync python examples/render.py"

[tasks.notebooks]
depends = ["py:sync"]
run = "uv run --no-sync python examples/notebooks.py"

[tasks.docs]
depends = ["py:build"]
run = "uv run --no-sync mkdocs serve"

[tasks.docs-build]
depends = ["py:build"]
run = ["uv run --no-sync python -c \"import shutil; [shutil.rmtree(p, True) for p in ('docs/examples', 'site')]\"", "uv run --no-sync mkdocs build --strict"]

[tasks.docs-deploy]
depends = ["py:build"]
run = ["uv run --no-sync python -c \"import shutil; [shutil.rmtree(p, True) for p in ('docs/examples', 'site')]\"", "uv run --no-sync mkdocs gh-deploy --force"]

[tasks."conda:recipe"]
run = "pixi exec rattler-build build -r packaging/conda-forge -m packaging/conda-forge/local-variants.yaml --output-dir .compat/conda-bld"

[tasks.changelog]
run = "git-cliff -o CHANGELOG.md"
