[env]
_.path = ["~/.cargo/bin"]
UV_PYTHON = "3.13"

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
depends = ["py:build", "py:browsers"]
run = ["cargo test --workspace --exclude boitata-py", "uv run --no-sync pytest -q", { task = "js:test" }]

[tasks.lint]
depends = ["py:sync", "js:install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "uv run --no-sync ruff check python examples ci",
  "uv run --no-sync ruff format --check python examples ci",
  "npm --prefix js/viewer run check",
]

[tasks."py:sync"]
run = "uv sync -q --inexact"

[tasks."py:build"]
depends = ["py:sync", "js:build"]
run = "uv run --no-sync maturin develop -q --uv --release"

[tasks."py:browsers"]
depends = ["py:sync"]
run = "uv run --no-sync playwright install chromium"

[tasks."js:install"]
dir = "js/viewer"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --no-audit --no-fund"

[tasks."js:build"]
depends = ["js:install"]
dir = "js/viewer"
run = "npm run build"

[tasks."js:test"]
depends = ["js:install"]
dir = "js/viewer"
run = "npm test"

[tasks.verify]
depends = ["lint", "test"]

[tasks.dist]
run = "python ci/compat.py dist"

[tasks.compat]
usage = 'arg "[mode]" default="all" help="all, dist, venv, uv, pixi or conda"'
run = "python ci/compat.py {{usage.mode}}"

[tools]
pixi = "0.81"
git-cliff = "2.13"
python = "3.13"
uv = "0.12"
micromamba = "2.9"
node = "24"

[tasks.examples]
depends = ["py:build"]
run = "uv run --no-sync python examples/render.py"

[tasks.notebooks]
depends = ["py:build"]
run = "uv run --no-sync python examples/notebooks.py"

[tasks.docs]
depends = ["py:build"]
run = "uv run --no-sync mkdocs serve"

[tasks.docs-build]
depends = ["py:build"]
run = ["uv run --no-sync python -c \"import shutil; [shutil.rmtree(p, True) for p in ('docs/examples', 'site')]\"", "uv run --no-sync mkdocs build --strict"]

[tasks."conda:recipe"]
run = "pixi exec rattler-build build -r packaging/conda-forge -m packaging/conda-forge/local-variants.yaml --output-dir .compat/conda-bld"

[tasks.changelog]
run = "git-cliff -o CHANGELOG.md"

[tasks.bench]
description = "Criterion benches for the simulation crate. Pass a filter, for example scenario."
usage = 'arg "[filter]" default="" help="Criterion filter, for example scenario or scenario/sgs-shared"'
run = "cargo bench -p simulation --bench simulation -- {{usage.filter}}"

[tasks.profile]
description = "Profile one simulation bench for 10s and print the top-15 self-time table."
usage = 'arg "<filter>" help="Criterion filter, for example scenario/sis"'
run = [
  "cargo bench -p simulation --bench simulation -- --profile-time 10 {{usage.filter}}",
  "find target/criterion -name top.txt -path '*{{usage.filter}}*' -exec echo {} \\; -exec cat {} \\;",
]

[tasks.profile.env]
CARGO_PROFILE_BENCH_DEBUG = "line-tables-only"
