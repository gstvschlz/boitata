[env]
_.path = ["~/.cargo/bin"]

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
depends = ["py:build"]
run = ["cargo test --workspace --exclude ceres-py", "uv run --no-sync pytest -q"]

[tasks.lint]
depends = ["py:sync"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "uv run --no-sync ruff check python examples/plot",
  "uv run --no-sync ruff format --check python examples/plot",
]

[tasks."py:sync"]
run = "uv sync -q --inexact"

[tasks."py:build"]
depends = ["py:sync"]
run = "uv run --no-sync maturin develop -q --uv --release"

[tasks.verify]
depends = ["lint", "test"]

[tools]
python = "3.13"
uv = "0.12"

[tasks."examples:data"]
run = [
  "curl -sfL --create-dirs -o examples/data/walker_sample.csv https://raw.githubusercontent.com/gstvschlz/datasets/560bd39c9ec79dcd6565dc763009aa83cac68fb8/walker-lake/sample.csv",
  "curl -sfL --create-dirs -o examples/data/walker_exhaustive.csv https://raw.githubusercontent.com/gstvschlz/datasets/560bd39c9ec79dcd6565dc763009aa83cac68fb8/walker-lake/exhaustive.csv",
]

[tasks.examples]
depends = ["examples:data"]
run = [
  "cargo run -q --release -p ceres-examples --bin 01_data",
  "uv run -q --no-project --with-requirements examples/requirements.txt examples/plot/01_data.py",
  "cargo run -q --release -p ceres-examples --bin 02_normal_score",
  "uv run -q --no-project --with-requirements examples/requirements.txt examples/plot/02_normal_score.py",
  "cargo run -q --release -p ceres-examples --bin 03_variography",
  "uv run -q --no-project --with-requirements examples/requirements.txt examples/plot/03_variography.py",
]
