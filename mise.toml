[env]
_.path = ["~/.cargo/bin"]

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
depends = ["py:build"]
run = ["cargo test --workspace --exclude ceres-py", "uv run --no-sync pytest -q"]

[tasks.lint]
depends = ["py:sync"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "uv run --no-sync ruff check python examples",
  "uv run --no-sync ruff format --check python examples",
]

[tasks."py:sync"]
run = "uv sync -q --inexact"

[tasks."py:build"]
depends = ["py:sync"]
run = "uv run --no-sync maturin develop -q --uv --release"

[tasks.verify]
depends = ["lint", "test"]

[tools]
python = "3.13"
uv = "0.12"

[tasks.examples]
depends = ["py:build"]
run = [
  "uv run --no-sync python examples/01-data/example.py",
  "uv run --no-sync python examples/02-normal-score/example.py",
  "uv run --no-sync python examples/03-variography/example.py",
  "uv run --no-sync python examples/04-kriging/example.py",
  "uv run --no-sync python examples/05-simulation/example.py",
  "uv run --no-sync python examples/06-drillholes/example.py",
  "uv run --no-sync python examples/07-solids/example.py",
  "uv run --no-sync python examples/08-cokriging/example.py",
  "uv run --no-sync python examples/09-change-of-support/example.py",
  "uv run --no-sync python examples/10-compositional/example.py",
]
