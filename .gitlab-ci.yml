workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH =~ /^ci\/colab-/

stages: [build, wheels, release]

.release-or-web:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

.tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

.mise:
  image: rust:1-bookworm
  variables:
    MISE_YES: "1"
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  before_script:
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    - mise install python uv node

viewer:
  stage: build
  extends: .release-or-web
  image: node:24-bookworm
  script:
    - cd js/viewer && npm ci --no-audit --no-fund && npm run check && npm test && npm run build
  artifacts:
    paths: [python/boitata/_viewer.js]

test:
  stage: build
  extends: [.mise, .release-or-web]
  script:
    - mise run py:build
    - uv run --no-sync playwright install --with-deps chromium
    - uv run --no-sync --with pytest-cov pytest --cov --cov-branch --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pages:
  stage: build
  extends: .mise
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mise run py:build
    - uv run --no-sync playwright install --with-deps chromium
    - mise run docs-build
  pages:
    publish: site
  artifacts:
    paths: [site]

# Linux runners only (GitLab.com has no free macOS runners): zig links the Linux and macOS
# wheels, cargo-xwin the Windows one.
wheels:
  stage: wheels
  extends: .release-or-web
  image: rust:1-bookworm
  needs: [viewer]
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - rustup target add "$TARGET"
    - |
      case "$TARGET" in
        *linux*) FLAGS="--zig --compatibility manylinux2014" ;;
        *darwin*) FLAGS="--zig" ;;
        *windows*) apt-get update -qq && apt-get install -y -qq clang lld llvm >/dev/null && uv tool install cargo-xwin ;;
      esac
    - uvx --from "maturin[zig]>=1.10,<2" maturin build --release --target "$TARGET" $FLAGS --out dist
    - uv run --no-project python -c "import glob, zipfile; assert all('boitata/_viewer.js' in zipfile.ZipFile(w).namelist() for w in glob.glob('dist/*.whl'))"
    - uvx abi3audit --strict --assume-minimum-abi3 3.11 --verbose dist/*.whl
    - |
      if [ "${TARGET#*linux}" != "$TARGET" ]; then
        uvx auditwheel show dist/*.whl
        uv run --no-project python -m zipfile -e dist/*.whl wheel
        readelf -d wheel/boitata/_boitata*.so | tee needed.txt
        if grep -qi libpython needed.txt; then exit 1; fi
      fi
  artifacts:
    paths: [dist]

publish:
  stage: release
  extends: .tag
  image: python:3.13-slim
  needs: [wheels]
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install -q twine
    - >
      TOKEN=$(python -c "import json, os, urllib.request as r;
      req = r.Request('https://pypi.org/_/oidc/mint-token', json.dumps({'token': os.environ['PYPI_ID_TOKEN']}).encode());
      print(json.load(r.urlopen(req))['token'])")
    - twine upload --non-interactive -u __token__ -p "$TOKEN" dist/*

release:
  stage: release
  extends: .tag
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [publish]
  variables:
    GIT_DEPTH: 0
  script:
    - apk add -q git-cliff
    - git-cliff --latest --strip header -o notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: Boitatá ${CI_COMMIT_TAG}
    description: notes.md
    assets:
      links:
        - name: Wheels on PyPI
          url: https://pypi.org/project/boitata/#files

colab:
  stage: build
  image:
    name: us-docker.pkg.dev/colab-images/public/cpu-runtime
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^ci\/colab-/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 --output "$CI_PROJECT_DIR/executed.ipynb" notebooks/learn_00.ipynb
  artifacts:
    when: always
    paths: [executed.ipynb]
