[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "boitata"
description = "My Python tooling for day-to-day geostatistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Pretto Scholze" }]
keywords = ["geostatistics", "kriging", "variogram", "simulation", "mining", "geology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "tqdm>=4.66"]
dynamic = ["version"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
3d = ["pyvista>=0.45"]
all = ["ipywidgets>=8", "matplotlib>=3.8", "pandas>=2.2", "polars>=1.4", "pyarrow>=16", "pyvista>=0.45"]

[project.urls]
Homepage = "https://github.com/gstvschlz/boitata"
Documentation = "https://gstvschlz.github.io/boitata/"
Repository = "https://github.com/gstvschlz/boitata"
Issues = "https://github.com/gstvschlz/boitata/issues"

[dependency-groups]
dev = [
    "maturin>=1.10,<2",
    "pytest>=8",
    "ruff>=0.6",
    "polars>=1.4",
    "pyarrow>=16",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-gallery>=0.10.4",
    "pyvista>=0.45",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "boitata._boitata"
python-source = "python"
locked = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads datasets"]

[tool.coverage.run]
source = ["boitata"]

[tool.ruff]
line-length = 110
